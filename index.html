<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيان جهات متعاقدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f7f4ec;
  --paper-card:#fffdf8;
  --ink:#1c2b2c;
  --ink-soft:rgba(28,43,44,.62);
  --ink-faint:rgba(28,43,44,.4);
  --rule:#b3893f;
  --rule-soft:rgba(179,137,63,.35);
  --navy:#123a44;
  --navy-2:#1d5866;
  --good:#2e7d4f;
  --good-bg:#e9f3ec;
  --bad:#a13a2c;
  --bad-bg:#f7ebe8;
  --divider:rgba(28,43,44,.13);
  --divider-soft:rgba(28,43,44,.07);
  --shadow:0 18px 40px -22px rgba(28,43,44,.28), 0 4px 10px -6px rgba(28,43,44,.16);
  --stamp-rot:-6deg;
  --font-display:'Amiri','Lora',serif;
  --font-body:'IBM Plex Sans Arabic','Inter',sans-serif;
  --surface:#fff;
  --header-bg:#efe9d9;
  --portal-bg:#fffdf8;
}
html[lang="en"]{
  --font-display:'Lora','Amiri',serif;
  --font-body:'Inter','IBM Plex Sans Arabic',sans-serif;
  --stamp-rot:6deg;
}
html[data-theme="dark"]{
  --paper:#14181a;
  --paper-card:#1c2226;
  --ink:#e9e6dd;
  --ink-soft:rgba(233,230,221,.66);
  --ink-faint:rgba(233,230,221,.42);
  --rule:#c9a25a;
  --rule-soft:rgba(201,162,90,.32);
  --navy:#4f9ac0;
  --navy-2:#6bb4d8;
  --good:#5fc088;
  --good-bg:rgba(95,192,136,.14);
  --bad:#e2776a;
  --bad-bg:rgba(226,119,106,.14);
  --divider:rgba(233,230,221,.16);
  --divider-soft:rgba(233,230,221,.08);
  --shadow:0 18px 40px -22px rgba(0,0,0,.6), 0 4px 10px -6px rgba(0,0,0,.45);
  --surface:#20272b;
  --header-bg:#252d31;
  --portal-bg:#20272b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
:focus-visible{outline:2px solid var(--rule);outline-offset:2px;border-radius:6px;}
.preview-scroll,#cselPortal{scrollbar-width:thin;scrollbar-color:var(--divider) transparent;}
.preview-scroll::-webkit-scrollbar,#cselPortal::-webkit-scrollbar{width:7px;}
.preview-scroll::-webkit-scrollbar-thumb,#cselPortal::-webkit-scrollbar-thumb{background:var(--divider);border-radius:10px;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.7;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.display{font-family:var(--font-display);}
.page{max-width:1180px;margin:0 auto;padding:34px 26px 70px;}
::selection{background:var(--rule-soft);}

.print-running-header{display:none;}

.masthead{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding-bottom:22px;margin-bottom:26px;border-bottom:2px solid var(--rule);position:relative;
}
.mast-left{display:flex;align-items:center;gap:16px;min-width:0;}
.seal{flex-shrink:0;height:56px;width:56px;border-radius:50%;border:2px solid var(--navy);display:flex;align-items:center;justify-content:center;color:var(--navy);}
.mast-title h1{margin:0;font-size:26px;font-weight:700;color:var(--navy);}
.mast-title p{margin:5px 0 0;font-size:13px;color:var(--ink-soft);}
.mast-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:12px;font-weight:600;font-size:13.5px;
  padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:.2s;font-family:inherit;white-space:nowrap;
}
.btn-primary{background:var(--navy);color:#faf8f2;box-shadow:0 10px 22px -12px rgba(18,58,68,.55);}
.btn-primary:hover{background:var(--navy-2);}
.btn-outline{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-outline:hover{background:rgba(18,58,68,.06);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--divider);}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:var(--paper-card);border:1px solid var(--divider);border-radius:20px;box-shadow:var(--shadow);}

.import-card{padding:40px;text-align:center;margin-bottom:26px;}
.import-card .seal-lg{height:64px;width:64px;border-radius:50%;border:2px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--rule);margin:0 auto 18px;}
.import-card h2{margin:0 0 8px;font-size:20px;color:var(--navy);}
.import-card p.hint{margin:0 0 26px;color:var(--ink-soft);font-size:13.5px;}
.dropzone{border:2px dashed var(--divider);border-radius:16px;padding:34px 20px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:10px;}
.dropzone.drag{border-color:var(--rule);background:rgba(179,137,63,.06);}
.dropzone .dz-icon{color:var(--navy-2);}
.dropzone .dz-t{font-size:14.5px;font-weight:600;color:var(--ink);}
.dropzone .dz-s{font-size:12px;color:var(--ink-faint);}
.import-opts{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap;}
.import-opts label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.import-opts input{border:1px solid var(--divider);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink);width:170px;outline:none;}
.import-opts input:focus{border-color:var(--rule);}
#importStatus{margin-top:16px;font-size:13px;min-height:18px;}
#importStatus.err{color:var(--bad);}
#importStatus.ok{color:var(--good);}

.sheet-card{padding:30px;margin-bottom:26px;}
.sheet-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.sheet-opt{display:flex;align-items:center;gap:14px;border:1px solid var(--divider);border-radius:12px;padding:13px 16px;cursor:pointer;transition:.15s;}
.sheet-opt:hover{border-color:var(--ink-faint);}
.sheet-opt.active{border-color:var(--rule);background:rgba(179,137,63,.06);box-shadow:0 6px 16px -12px rgba(179,137,63,.5);}
.sheet-opt .sheet-icon{flex-shrink:0;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--divider);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);transition:.15s;}
.sheet-opt.active .sheet-icon{border-color:var(--rule);color:var(--rule);}
.sheet-opt .sheet-body{flex:1;min-width:0;}
.sheet-opt .sheet-name{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;}
.sheet-opt .sheet-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.sheet-opt .sheet-radio{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--divider);position:relative;transition:.15s;}
.sheet-opt.active .sheet-radio{border-color:var(--rule);}
.sheet-opt.active .sheet-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--rule);}
.preview-card{padding:30px;margin-bottom:26px;}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.preview-head h2{margin:0;font-size:18px;color:var(--navy);}
.preview-summary{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
.preview-summary b{color:var(--ink);}
#previewToolbar{margin-bottom:14px;}
#previewToolbar .btn{padding:7px 14px;font-size:12px;border-radius:9px;}
.preview-scroll{max-height:420px;overflow:auto;border:1px solid var(--divider);border-radius:14px;margin-bottom:18px;}
.preview-scroll table{width:100%;border-collapse:collapse;}
.preview-scroll th{position:sticky;top:0;background:var(--header-bg);color:var(--navy);font-size:11.5px;font-weight:700;padding:10px 12px;white-space:nowrap;text-align:start;z-index:1;}
.preview-scroll td{padding:9px 12px;font-size:12.5px;border-top:1px solid var(--divider-soft);white-space:nowrap;}
.preview-scroll tr.invalid td{background:var(--bad-bg);color:var(--bad);}
.preview-scroll tr.invalid td.notes{font-weight:600;}
.preview-scroll tr.excluded td{opacity:.4;}
.preview-scroll tr:not(.excluded) td.colcheck{position:relative;}
.preview-scroll th.colcheck,.preview-scroll td.colcheck{width:34px;text-align:center;}
.row-check{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-faint);background:var(--surface);cursor:pointer;position:relative;transition:.15s;vertical-align:middle;}
.row-check:hover{border-color:var(--rule);}
.row-check:checked{background:var(--rule);border-color:var(--rule);}
.row-check:checked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
.row-check:indeterminate{background:var(--rule);border-color:var(--rule);}
.row-check:indeterminate::after{content:'';position:absolute;left:3px;top:6.5px;width:8px;height:2px;background:#fff;}
.status-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;}
.status-dot.ok{background:var(--good-bg);color:var(--good);}
.status-dot.bad{background:var(--bad-bg);color:var(--bad);}
.preview-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

.kpi-strip{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.kpi{flex:1;min-width:190px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;transition:transform .25s ease;}
.kpi:hover{transform:translateY(-3px);}
.kpi .kpi-label{font-size:12px;color:var(--ink-soft);}
.kpi .kpi-value{font-size:23px;font-weight:700;color:var(--ink);}
.kpi .kpi-sub{font-size:11.5px;color:var(--ink-faint);}
.kpi.accent .kpi-value{color:var(--navy);}
.kpi.good .kpi-value{color:var(--good);}
.kpi.bad .kpi-value{color:var(--bad);}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.toolbar.second{margin-bottom:14px;}
.toolbar.third{margin-bottom:14px;}
.toolbar.fourth{margin-bottom:22px;}
.toolbar.fourth .icon-btn{border:1px solid var(--divider);border-radius:9px;width:32px;height:32px;}
.toolbar.fourth .icon-btn:hover{border-color:var(--ink-faint);}
.sort-rules{display:inline-flex;align-items:center;gap:16px;flex-wrap:wrap;}
.sort-rule{display:inline-flex;align-items:center;gap:6px;}
.chip-row{display:inline-flex;gap:8px;flex-wrap:wrap;}
.chip-toggle{border:1px solid var(--divider);background:var(--surface);color:var(--ink-soft);padding:9px 15px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap;}
.chip-toggle:hover{border-color:var(--ink-faint);color:var(--ink);}
.chip-toggle.active{background:var(--navy);color:#faf8f2;border-color:var(--navy);box-shadow:0 8px 18px -10px rgba(18,58,68,.45);}
.search-wrap{position:relative;flex:1;min-width:210px;max-width:300px;}
.search-wrap svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.search-wrap input{width:100%;padding:10px 12px;padding-inline-start:34px;border-radius:11px;border:1px solid var(--divider);background:var(--surface);font-family:inherit;font-size:13.5px;color:var(--ink);outline:none;transition:.2s;}
.search-wrap input:focus{border-color:var(--rule);box-shadow:0 0 0 3px rgba(179,137,63,.14);}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);}
.seg-btn{border:none;background:transparent;color:var(--ink-soft);padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;}
.seg-btn.active{background:var(--navy);color:#faf8f2;}
.spacer{flex:1;}
.field-label{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-inline-end:2px;white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;}
.link-btn:hover{color:var(--ink);}

.csel-wrap{position:relative;min-width:150px;}
.csel-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--divider);background:var(--surface);border-radius:11px;padding:9px 13px;
  font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;transition:.2s;text-align:start;
}
.csel-trigger:hover{border-color:var(--ink-faint);}
.csel-trigger.on{border-color:var(--rule);box-shadow:0 0 0 3px rgba(179,137,63,.14);}
.csel-trigger.active-filter{border-color:var(--navy);background:rgba(18,58,68,.045);}
.csel-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.csel-chev{color:var(--ink-faint);flex-shrink:0;transition:transform .2s;}
.csel-trigger.on .csel-chev{transform:rotate(180deg);}
#cselPortal{
  position:fixed;z-index:1000;max-height:270px;overflow-y:auto;border-radius:14px;
  border:1px solid var(--divider);background:var(--portal-bg);box-shadow:0 26px 50px -20px rgba(28,43,44,.35);
  padding:6px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;
  transition:opacity .15s ease, transform .15s ease;pointer-events:none;
}
#cselPortal.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.csel-opt{padding:9px 12px;border-radius:9px;font-size:13px;color:var(--ink);cursor:pointer;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.csel-opt:hover,.csel-opt.hl{background:rgba(28,43,44,.06);}
.csel-opt.sel{background:rgba(18,58,68,.09);color:var(--navy);font-weight:700;}

.group-table-wrap{border-radius:18px;overflow-x:auto;overflow-y:hidden;border:1px solid var(--divider);box-shadow:var(--shadow);margin-bottom:22px;transition:box-shadow .25s ease;}
table{width:100%;border-collapse:collapse;background:var(--paper-card);}
.group-band th{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#faf8f2;text-align:start;font-size:13.5px;font-weight:700;padding:13px 18px;letter-spacing:.01em;}
.group-band .g-count{font-weight:400;font-size:12px;opacity:.82;margin-inline-start:10px;}
.col-head th{background:var(--header-bg);color:var(--navy);font-size:12px;font-weight:700;text-align:start;padding:11px 14px;border-bottom:2px solid var(--rule-soft);white-space:nowrap;}
.col-head th.num{text-align:left;}
tbody tr{border-bottom:1px solid var(--divider-soft);}
tbody tr:last-child{border-bottom:none;}
tbody tr:nth-child(even){background:rgba(28,43,44,.018);}
td{padding:12px 14px;font-size:13.5px;color:var(--ink);vertical-align:middle;}
td.name{font-weight:600;}
td.num{text-align:left;direction:ltr;font-weight:600;}
td.muted{color:var(--ink-soft);}
td.actions-cell{text-align:center;width:40px;}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.pill-var{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;direction:ltr;}
.pill-var.good{background:var(--good-bg);color:var(--good);}
.pill-var.bad{background:var(--bad-bg);color:var(--bad);}
.icon-btn{border:none;background:transparent;color:var(--ink-faint);width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.icon-btn:hover{background:rgba(28,43,44,.08);color:var(--ink);}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.ecard{padding:22px;display:flex;flex-direction:column;gap:16px;break-inside:avoid;position:relative;transition:transform .25s ease,box-shadow .25s ease;}
.ecard:hover{transform:translateY(-3px);}
.ecard .icon-btn{position:absolute;top:14px;inset-inline-end:14px;}
.ecard-top{display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--divider);padding-bottom:14px;padding-inline-end:26px;}
.ecard-name{font-size:15.5px;font-weight:700;color:var(--ink);}
.ecard-meta{font-size:11.5px;color:var(--ink-faint);}
.ecard-amounts{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.amt-block{display:flex;flex-direction:column;gap:3px;}
.amt-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.amt-value{font-size:17px;font-weight:700;direction:ltr;}
.amt-block.before .amt-value{color:var(--ink-soft);font-weight:600;text-decoration:line-through;text-decoration-color:rgba(28,43,44,.3);text-decoration-thickness:1px;text-underline-offset:3px;}
.amt-block.after{text-align:end;}
.amt-block.after .amt-value{color:var(--navy);font-weight:800;}
.amt-block.after .amt-label{color:var(--rule);}
.amt-arrow{color:var(--ink-faint);flex-shrink:0;}
.stamp-wrap{display:flex;justify-content:center;padding-top:2px;}
.stamp{position:relative;width:78px;height:78px;border-radius:50%;border:2.5px dashed currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(var(--stamp-rot));font-weight:700;}
.stamp .s-pct{font-size:15px;direction:ltr;}
.stamp .s-lbl{font-size:9.5px;font-weight:700;letter-spacing:.03em;margin-top:1px;}
.stamp.good{color:var(--good);}
.stamp.bad{color:var(--bad);}

.group-block{margin-bottom:22px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);font-size:13.5px;}
.no-print{}

.toast-host{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:999;}
.toast{background:var(--navy);color:#faf8f2;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 16px 30px -14px rgba(18,58,68,.5);}

.import-slots{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0 6px;text-align:start;}
.import-slot{border:1.5px dashed var(--divider);border-radius:16px;padding:20px;transition:.2s;}
.import-slot.filled{border-style:solid;border-color:var(--rule-soft);background:rgba(179,137,63,.045);}
.slot-kind-label{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:12px;letter-spacing:.01em;}
.slot-dz{border:2px dashed var(--divider);border-radius:12px;padding:22px 12px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.slot-dz.drag{border-color:var(--rule);background:rgba(179,137,63,.06);}
.slot-dz .dz-icon{color:var(--navy-2);}
.slot-dz .dz-t{font-size:13px;font-weight:600;color:var(--ink);}
.slot-dz .dz-s{font-size:11px;color:var(--ink-faint);}
.slot-filled-body{display:flex;align-items:flex-start;gap:12px;}
.slot-filled-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--good-bg);color:var(--good);display:flex;align-items:center;justify-content:center;}
.slot-filled-info{flex:1;min-width:0;}
.slot-file-name{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot-file-meta{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.audit-line{font-size:11px;margin-top:7px;display:inline-flex;align-items:center;gap:5px;}
.audit-line.ok{color:var(--good);}
.audit-line.warn{color:var(--rule);}
.slot-actions{display:flex;gap:8px;margin-top:13px;}
.slot-actions .btn{padding:6px 12px;font-size:11.5px;border-radius:8px;}
.import-proceed{display:flex;justify-content:center;margin-top:22px;}

.slot-loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 6px 6px;}
.slot-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--divider);border-top-color:var(--navy);animation:slot-spin .8s linear infinite;}
@keyframes slot-spin{to{transform:rotate(360deg);}}
.slot-loading-text{font-size:12px;color:var(--ink-soft);font-weight:600;}
.slot-progress{width:100%;max-width:220px;height:6px;border-radius:999px;background:var(--divider-soft);overflow:hidden;}
.slot-progress-bar{height:100%;width:0%;background:var(--navy);border-radius:999px;transition:width .2s ease;}
.slot-progress-bar.indeterminate{width:40%!important;animation:slot-indet 1.1s ease-in-out infinite;}
@keyframes slot-indet{0%{margin-inline-start:-40%;}100%{margin-inline-start:100%;}}

.kind-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--divider);margin-inline-start:14px;vertical-align:middle;}
.kind-seg button{border:none;background:transparent;color:var(--ink-soft);padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;}
.kind-seg button.active{background:var(--navy);color:#faf8f2;}

.match-panel{padding:20px 26px;margin-bottom:22px;}
.match-head{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
.match-head .chev{transition:transform .2s;color:var(--ink-faint);flex-shrink:0;}
.match-panel.open .match-head .chev{transform:rotate(180deg);}
.match-summary{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;}
.match-summary b{color:var(--navy);}
.match-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.match-panel.open .match-body{max-height:1000px;}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding-top:18px;}
@media (max-width:760px){.match-cols{grid-template-columns:1fr;}}
.match-col h4{margin:0 0 10px;font-size:12px;color:var(--ink-soft);font-weight:700;}
.match-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider-soft);flex-wrap:wrap;}
.match-row:last-child{border-bottom:none;}
.match-name{font-size:13px;color:var(--ink);font-weight:600;}
.match-plain{font-size:13px;color:var(--ink-soft);padding:9px 0;border-bottom:1px solid var(--divider-soft);}
.match-plain:last-child{border-bottom:none;}
.match-empty{font-size:12px;color:var(--ink-faint);padding:6px 0;}

.period-fields{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.period-divider{width:1px;height:22px;background:var(--divider);}
.toggle-switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;user-select:none;white-space:nowrap;}
.toggle-switch input{appearance:none;-webkit-appearance:none;margin:0;width:34px;height:19px;border-radius:999px;background:var(--divider);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle-switch input::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:15px;height:15px;border-radius:50%;background:var(--surface);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle-switch input:checked{background:var(--navy);}
.toggle-switch input:checked::after{inset-inline-start:17px;}

.marker-badge{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;margin-inline-start:6px;white-space:nowrap;vertical-align:middle;}
.marker-badge.onlyClaims{color:var(--navy);background:rgba(18,58,68,.09);}
.marker-badge.onlyAccounts{color:var(--rule);background:rgba(179,137,63,.14);}
.src-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.01em;white-space:nowrap;}
.src-chip.claims{color:var(--navy);}
.src-chip.accounts{color:var(--rule);}
.delta-pill{font-size:11.5px;font-weight:700;direction:ltr;}
.delta-pill.good{color:var(--good);}
.delta-pill.bad{color:var(--bad);}
.acct-na{color:var(--ink-faint);cursor:help;}
.kpi-sub .audit-line{margin-top:0;}
.kpi-label{display:inline-flex;align-items:center;gap:6px;}
.kpi-src-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.kpi-src-dot.claims{background:var(--navy);}
.kpi-src-dot.accounts{background:var(--rule);}
.kpi-sub{display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.kpi-sub-note{color:var(--ink-faint);}
.avg-src-toggle{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:var(--divider-soft);}
.avg-src-btn{border:none;background:transparent;color:var(--ink-faint);font-family:inherit;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;cursor:pointer;transition:.15s;}
.avg-src-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}

.entity-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.entity-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.entity-count-note{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.entity-info-icon{color:var(--ink-faint);cursor:help;display:inline-flex;}
.entity-ecard{gap:10px;}
.entity-ecard-name{font-family:var(--font-display);font-size:16.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;padding-inline-end:26px;}
.entity-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--divider-soft);font-size:12.5px;}
.entity-line.no-border{border-top:none;padding-top:0;}
.entity-line.grouped{border-top:none;padding-top:4px;}
.entity-group-head{padding-top:10px;border-top:1px solid var(--divider-soft);}
.entity-group-head.no-border{border-top:none;padding-top:0;}
.entity-line-label{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;}
.entity-line-value{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.entity-reconcile{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
.entity-reconcile.match{color:var(--good);}
.entity-reconcile svg{flex-shrink:0;}
.entity-reconcile-note{font-size:10px;color:var(--ink-faint);margin-top:2px;}
.entity-empty-note{font-size:12px;color:var(--ink-faint);text-align:center;padding:30px 0;}

@media (max-width:760px){
  .masthead{flex-direction:column;align-items:flex-start;}
  .kpi-strip{flex-direction:column;}
  .csel-wrap{min-width:130px;}
}

@media print{
  html,html[data-theme="dark"]{
    --paper:#fff; --paper-card:#fff; --surface:#fff; --header-bg:#fff; --portal-bg:#fff;
    --ink:#000; --ink-soft:#333; --ink-faint:#555;
    --rule:#000; --rule-soft:#888;
    --navy:#000; --navy-2:#000;
    --good:#000; --good-bg:transparent;
    --bad:#000; --bad-bg:transparent;
    --divider:#999; --divider-soft:#ccc;
    --shadow:none;
  }
  body{background:#fff;-webkit-print-color-adjust:economy;print-color-adjust:economy;padding-top:36px;font-size:12px;}
  .page{max-width:none;padding:0 8mm 8mm;margin:0;}
  .no-print{display:none !important;}
  .card,.group-table-wrap{box-shadow:none;}
  .card,.ecard,.group-table-wrap,.kpi{border:1px solid #000;}
  .masthead{margin-bottom:18px;border-bottom-color:#000;}
  .ecard{box-shadow:none;}
  .print-running-header{display:flex;position:fixed;top:0;inset-inline:0;align-items:center;justify-content:space-between;padding:8px 8mm;font-size:10.5px;color:#333;border-bottom:1px solid #999;background:#fff;}
  .group-band{background:#fff !important;}
  .group-band th{background:#fff !important;color:#000 !important;border-bottom:1.5px solid #000;}
  .col-head th{background:#fff !important;color:#000 !important;border-bottom:1.5px solid #000;}
  .tag{background:transparent !important;color:#000 !important;border:1px solid #666;}
  .pill-var{background:transparent !important;color:#000 !important;border:1px solid #999;}
  .stamp{color:#000 !important;}
  .kpi .kpi-value,.kpi.accent .kpi-value,.kpi.good .kpi-value,.kpi.bad .kpi-value{color:#000 !important;}
  .amt-block.after .amt-value{color:#000 !important;}
  tbody tr:nth-child(even){background:#f5f5f5;}
  tr{break-inside:avoid;}
  .group-block{break-inside:auto;}
  .group-table-wrap{break-inside:auto;}
  #kpiStrip{break-after:page;page-break-after:always;}
}
</style>
</head>
<body>

  <span id="printRunMeta"></span>

<div class="toast-host" id="toastHost"></div>

<div class="page">

  </header>

  <section class="card import-card no-print" id="importZone">
    <div class="seal-lg">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 21h16"/></svg>
    </div>
    <h2 id="importTitle"></h2>
    <p class="hint" id="importHint"></p>
    <div class="import-slots">
      <div class="import-slot" id="slotClaims" data-kind="claims">

        <div id="slotClaimsEmpty">

            <div class="dz-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 18a4 4 0 0 1-.6-7.95A5 5 0 0 1 16 8a4.5 4.5 0 0 1 1.1 8.86"/><path d="M12 12v7M9.5 14.5L12 12l2.5 2.5"/></svg></div>
            <div class="dz-t" id="dzClaimsTitle"></div>
            <div class="dz-s">xlsx, xls, csv</div>
          </div>
          <input type="file" id="fileInputClaims" accept=".xlsx,.xls,.csv" style="display:none;">

        <div class="slot-loading" id="slotClaimsLoading" hidden>

          <div class="slot-progress"><div class="slot-progress-bar" id="slotClaimsProgressBar"></div></div>

            <div class="slot-filled-info">
              <div class="slot-file-name" id="slotClaimsFileName"></div>
              <div class="slot-file-meta" id="slotClaimsFileMeta"></div>
              <div id="slotClaimsAudit"></div>
            </div>
          </div>
          <div class="slot-actions">
            <button class="btn btn-ghost" id="slotClaimsReplaceBtn"></button>
            <button class="btn btn-ghost" id="slotClaimsRemoveBtn"></button>
          </div>
        </div>
      </div>
      <div class="import-slot" id="slotAccounts" data-kind="accounts">
        <div class="slot-kind-label" id="slotAccountsLabel"></div>
        <div id="slotAccountsEmpty">
          <div class="slot-dz" id="dzAccounts">
            <div class="dz-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 18a4 4 0 0 1-.6-7.95A5 5 0 0 1 16 8a4.5 4.5 0 0 1 1.1 8.86"/><path d="M12 12v7M9.5 14.5L12 12l2.5 2.5"/></svg></div>
            <div class="dz-t" id="dzAccountsTitle"></div>
            <div class="dz-s">xlsx, xls, csv</div>
          </div>
          <input type="file" id="fileInputAccounts" accept=".xlsx,.xls,.csv" style="display:none;">
        </div>
        <div class="slot-loading" id="slotAccountsLoading" hidden>
          <div class="slot-spinner"></div>
          <div class="slot-loading-text" id="slotAccountsLoadingText"></div>
          <div class="slot-progress"><div class="slot-progress-bar" id="slotAccountsProgressBar"></div></div>
        </div>
        <div class="slot-filled" id="slotAccountsFilled" hidden>
          <div class="slot-filled-body">
            <div class="slot-filled-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
            <div class="slot-filled-info">
              <div class="slot-file-name" id="slotAccountsFileName"></div>
              <div class="slot-file-meta" id="slotAccountsFileMeta"></div>
              <div id="slotAccountsAudit"></div>
            </div>
          </div>
          <div class="slot-actions">
            <button class="btn btn-ghost" id="slotAccountsReplaceBtn"></button>
            <button class="btn btn-ghost" id="slotAccountsRemoveBtn"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="import-opts">
      <label id="currencyLabel"><input type="text" id="currencyInput" value=""></label>
    </div>
    <div id="importStatus"></div>
    <div class="import-proceed">
      <button class="btn btn-primary" id="proceedReportBtn" hidden></button>
    </div>
  </section>

  <section class="card sheet-card no-print" id="sheetZone" hidden>
    <div class="preview-head"><h2 id="sheetTitle"></h2></div>
    <p class="preview-summary" id="sheetHint"></p>
    <div class="sheet-list" id="sheetList"></div>
    <div class="preview-actions">
      <button class="btn btn-ghost" id="cancelSheetBtn"></button>
      <button class="btn btn-primary" id="confirmSheetBtn"></button>
    </div>
  </section>

  <section class="card preview-card no-print" id="previewZone" hidden>
    <div class="preview-head"><h2 id="previewTitle"></h2>
      <div class="kind-seg" id="previewKindSeg">
        <button type="button" data-kind="claims" id="previewKindClaimsBtn"></button>
        <button type="button" data-kind="accounts" id="previewKindAccountsBtn"></button>
      </div>
    </div>
    <p class="preview-summary" id="previewSummary"></p>
    <div class="toolbar" id="previewToolbar">
      <button class="btn btn-ghost" id="selectAllRowsBtn"></button>
      <button class="btn btn-ghost" id="selectValidRowsBtn"></button>
      <button class="btn btn-ghost" id="selectNoneRowsBtn"></button>
    </div>

      <tbody id="previewBody"></tbody>
    </table></div>

      <button class="btn btn-primary" id="confirmImportBtn"></button>

            <div id="matchAccountsOnlyList"></div>

          <div class="match-col">
            <h4 id="matchClaimsOnlyTitle"></h4>
            <div id="matchClaimsOnlyList"></div>

        <span class="field-label" id="periodToArrow">→</span>

      <div class="chip-row" id="groupDimChips"></div>
      <div class="spacer"></div>

        <button class="seg-btn" data-mode="aggregated"></button>

      <div class="csel-wrap" id="filterCategoryWrap"></div>
      <div class="csel-wrap" id="filterBudgetWrap"></div>
      <div class="csel-wrap" id="filterMonthWrap"></div>
      <div class="csel-wrap" id="filterYearWrap"></div>
      <button class="chip-toggle" id="matchedOnlyChip"></button>

        <span id="addSortLabel"></span>
      </button>
    </div>
    <div id="viewHost"></div>
  </section>
</div>

function normalizeText(s){
  return String(s||'')
    .normalize('NFKC')
    .replace(/[\u200B-\u200F\u061C\uFEFF]/g,'')
    .replace(/[\u064B-\u0652\u0670\u0640]/g,'')
    .replace(/[إأآا]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/[يى]/g,'ي')
    .replace(/[\s\u00A0\u202F\u2009\u3000]+/g,' ')
    .toLowerCase()
    .trim();
}
function hashPalette(str){
  const s = normalizeText(str)||'—';
  let h = 0;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
}
function tagHtml(text){
  const p = hashPalette(text);
  return '<span class="tag" style="background:'+p.bg+';color:'+p.fg+';">'+esc(text||'—')+'</span>';
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return new Intl.NumberFormat('en-US').format(Math.round(n||0)); }
function fmtSigned(n){ return (n>=0?'':'−')+fmt(Math.abs(n)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function parseNum(v){
  if(v===null || v===undefined) return {ok:true, value:0, blank:true};
  if(typeof v === 'number'){ return Number.isFinite(v) ? {ok:true, value:v} : {ok:false, value:0}; }
  let s = String(v).trim();
  if(s===''||s==='—'||s==='-'||s==='–') return {ok:true, value:0, blank:true};
  s = s.replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0)-0x0660))
       .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0)-0x06F0));
  let neg = false;
  const paren = s.match(/^\((.*)\)$/);
  if(paren){ neg = true; s = paren[1].trim(); }
  if(/-\s*$/.test(s)){ neg = true; s = s.replace(/-\s*$/,''); }
  if(/^-/.test(s)){ neg = true; s = s.slice(1); }
  s = s.replace(/[\s\u00A0\u202F\u2009\u066C,']/g,'');
  s = s.replace(/\u066B/g,'.');
  if(s===''||s==='.') return {ok:true, value:0, blank:true};
  const n = Number(s);
  if(!Number.isFinite(n)) return {ok:false, value:0};
  return {ok:true, value: neg ? -n : n};
}
function isoFromParts(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function isoFromDate(d){ return isoFromParts(d.getFullYear(), d.getMonth()+1, d.getDate()); }
function parseDate(v){
  if(v===null || v===undefined || v==='') return null;
  if(v instanceof Date){ return isNaN(v) ? null : isoFromDate(v); }
  if(typeof v === 'number'){
    const ms = Math.round((v - 25569) * 86400 * 1000);
    const d = new Date(ms);
    return isNaN(d) ? null : isoFromDate(d);
  }
  let s = String(v).trim();
  if(!s) return null;
  s = s.replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x0660));
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return isoFromParts(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let p1=+m[1], p2=+m[2], y=+m[3];
    if(y<100) y += 2000;
    let day, month;
    if(p1>12){ day=p1; month=p2; }
    else if(p2>12){ month=p1; day=p2; }
    else { day=p1; month=p2; }
    if(month<1||month>12||day<1||day>31) return null;
    return isoFromParts(y, month, day);
  }
  const d2 = new Date(s);
  if(!isNaN(d2)) return isoFromDate(d2);
  return null;
}
function entityKey(name){
  let s = normalizeText(name);
  s = s.replace(/\s+/g,' ').replace(/[.,،؛:()"'\-_]/g,'').trim();
  return s;
}

function matchHeaderClaims(cell){

const HEADER_MAP_ACCOUNTS = [
  ['name', /^(الاسم|name)$/],

  ['orders', /payment\s*orders/],

];
function matchHeaderAccounts(cell){
  const c = normalizeText(cell).replace(/\s+/g,' ').trim();
  for(const [key, re] of HEADER_MAP_ACCOUNTS){ if(re.test(c)) return key; }

function scoreHeaderRow(headerRow, kind){
  const seen = new Set();
  headerRow.forEach(cell=>{
    const key = kind==='claims' ? matchHeaderClaims(cell) : matchHeaderAccounts(cell);
    if(key) seen.add(key);
  });
  return seen.size;
}
function detectKind(headerRow){
  const sc = scoreHeaderRow(headerRow,'claims');
  const sa = scoreHeaderRow(headerRow,'accounts');
  if(sc<3 && sa<3) return null;
  return sc>=sa ? 'claims' : 'accounts';
}
function extractRefCutoff(headerRow){
  for(const cell of headerRow){
    const s = String(cell||'');
    const m = s.match(/المتوسط\s*(قبل|بعد)\s*(\d{1,2})\s*[-\/](\d{2,4})/);
    if(m){
      let mm = +m[2], yy = +m[3];
      if(yy<100) yy += 2000;
      if(mm>=1 && mm<=12) return {m:mm, y:yy};
    }
  }
  return null;
}

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_EN_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_RANK = {};
[MONTHS_AR, MONTHS_EN, MONTHS_EN_SHORT].forEach(list=> list.forEach((m,i)=>{ MONTH_RANK[normalizeText(m)] = i+1; }));
for(let n=1;n<=12;n++){ MONTH_RANK[String(n)] = n; MONTH_RANK[String(n).padStart(2,'0')] = n; }
function monthRank(m){
  const r = MONTH_RANK[normalizeText(m)];
  return r===undefined ? 99 : r;
}
function mIdxFor(year, month){
  const y = Number(year);
  const r = monthRank(month);
  if(!y || r===99) return null;
  return y*12 + (r-1);
}
function monthLabel(mIdx){
  if(mIdx==null) return '—';
  const y = Math.floor(mIdx/12), m = ((mIdx%12)+12)%12;
  const names = state.lang==='ar' ? MONTHS_AR : MONTHS_EN;
  return names[m]+' '+y;
}

function sortFieldType(field){
  if(field==='month') return 'month';
  if(field==='year') return 'year';
  if(['before','after','discount','orders','dues','avgMonthly','refAvgBefore','refAvgAfter','delta','totalBefore','totalAfter','reconcileGap'].includes(field)) return 'number';
  return 'text';
}
function compareByField(a,b,field,dir){
  const type = sortFieldType(field);
  let res;
  if(type==='month') res = monthRank(a.month) - monthRank(b.month);
  else if(type==='year') res = (Number(a.year)||0) - (Number(b.year)||0);
  else if(type==='number') res = (a[field]||0) - (b[field]||0);
  else res = String(a[field]||'').localeCompare(String(b[field]||''), state.lang==='ar'?'ar':'en', {numeric:true, sensitivity:'base'});
  return dir==='desc' ? -res : res;
}
function applySort(records){
  const rules = state.sortRules.filter(r=>r.field && r.field!=='none');
  if(!rules.length) return records;
  return [...records].sort((a,b)=>{
    for(const rule of rules){
      const c = compareByField(a,b,rule.field,rule.dir);
      if(c!==0) return c;
    }
    return 0;
  });
}
function groupKeyCompare(va,vb,dim){
  if(dim==='month') return monthRank(va)-monthRank(vb);
  if(dim==='year') return (Number(va)||0)-(Number(vb)||0);
  return String(va).localeCompare(String(vb), state.lang==='ar'?'ar':'en', {numeric:true, sensitivity:'base'});
}
function compareGroupsBySort(entryA, entryB, active){
  const rules = state.sortRules.filter(r=>r.field && r.field!=='none');
  for(const rule of rules){
    const type = sortFieldType(rule.field);
    let c;
    if(type==='number' && ['before','after','discount'].includes(rule.field)){
      const sumA = entryA.rows.reduce((s,r)=>s+(r[rule.field]||0),0);
      const sumB = entryB.rows.reduce((s,r)=>s+(r[rule.field]||0),0);
      c = sumA - sumB;
    } else {
      const dimIdx = active.indexOf(rule.field);
      if(dimIdx===-1) continue;
      c = groupKeyCompare(entryA.parts[dimIdx], entryB.parts[dimIdx], rule.field);
    }
    if(rule.dir==='desc') c = -c;
    if(c!==0) return c;
  }
  return 0;
}

    +'<svg class="csel-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'
    +'</button>';
}
function renderCsel(wrapId, id, options, value){
  const wrap = document.getElementById(wrapId);
  if(!wrap) return;
  wrap.innerHTML = cselHtml(id, options, value);
}
function ensureCselPortal(){
  let el = document.getElementById('cselPortal');
  if(!el){
    el = document.createElement('div');
    el.id = 'cselPortal';
    el.setAttribute('role','listbox');
    el.hidden = true;
    document.body.appendChild(el);
  }
  return el;
}
function positionCselPortal(portal, triggerEl){
  const rect = triggerEl.getBoundingClientRect();
  const maxH = 270;
  const spaceBelow = window.innerHeight - rect.bottom;
  const openUp = spaceBelow < maxH && rect.top > spaceBelow;
  portal.style.width = Math.max(rect.width, 170) + 'px';
  const minLeft = 8, maxLeft = window.innerWidth - Math.max(rect.width,170) - 8;
  portal.style.left = Math.min(Math.max(rect.left, minLeft), Math.max(minLeft,maxLeft)) + 'px';
  if(openUp){ portal.style.top = 'auto'; portal.style.bottom = (window.innerHeight - rect.top + 6) + 'px'; }
  else { portal.style.bottom = 'auto'; portal.style.top = (rect.bottom + 6) + 'px'; }
}
function openCsel(id, triggerEl){
  const reg = cselRegistry[id];
  if(!reg) return;
  if(cselOpenId && cselOpenId !== id) closeCsel();
  const portal = ensureCselPortal();
  portal.hidden = false;
  portal.dataset.for = id;
  portal.innerHTML = reg.options.map(o=>'<div class="csel-opt '+(String(o.value)===reg.value?'sel':'')+'" data-value="'+esc(String(o.value))+'">'+esc(o.label)+'</div>').join('');
  positionCselPortal(portal, triggerEl);
  requestAnimationFrame(()=> portal.classList.add('open'));
  document.querySelectorAll('.csel-trigger.on').forEach(b=>b.classList.remove('on'));
  triggerEl.classList.add('on');
  triggerEl.setAttribute('aria-expanded','true');
  cselOpenId = id;
}
function closeCsel(){
  const portal = document.getElementById('cselPortal');
  if(portal){
    portal.classList.remove('open');
    setTimeout(()=>{ if(portal && !portal.classList.contains('open')) portal.hidden = true; }, 150);
  }
  document.querySelectorAll('.csel-trigger.on').forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-expanded','false'); });
  cselOpenId = null;
}
function chooseCsel(id, value){
  const reg = cselRegistry[id];
  reg.value = value;
  closeCsel();
  onCselChange(id, value);
}
function onCselChange(id, value){
  if(id==='filterEntitySel') state.filters.entity = value;
  else if(id==='filterCategorySel') state.filters.category = value;
  else if(id==='filterBudgetSel') state.filters.budget = value;
  else if(id==='filterMonthSel') state.filters.month = value;
  else if(id==='filterYearSel') state.filters.year = value;
  else if(id==='periodFromSel'){ state.period.from = Number(value); state.period.preset='custom'; clampPeriod(); }
  else if(id==='periodToSel'){ state.period.to = Number(value); state.period.preset='custom'; clampPeriod(); }
  else if(id==='periodCutoffSel'){ state.period.cutoff = Number(value); }
  else if(id.indexOf('matchSel_')===0){
    const accountKey = id.slice('matchSel_'.length);
    if(value){ state.entityMap[accountKey] = value; } else { delete state.entityMap[accountKey]; }
    rebuildIndex();
    renderMatchPanel();
    renderAll();
    return;
  } else {
    const m = id.match(/^sortField(\d+)Sel$/);
    if(m){
      const idx = Number(m[1]) - 1;
      if(state.sortRules[idx]) state.sortRules[idx].field = value;
    }
  }
  populateFilterOptions();
  renderSortControls();
  renderPeriodToolbar();
  renderAll();
}
document.addEventListener('click', (e)=>{
  const trigger = e.target.closest('[data-csel]');
  if(trigger){
    const id = trigger.dataset.csel;
    if(cselOpenId === id) closeCsel(); else openCsel(id, trigger);
    return;
  }
  const portal = document.getElementById('cselPortal');
  const opt = e.target.closest('.csel-opt');
  if(portal && !portal.hidden && opt && portal.contains(opt)){
    chooseCsel(portal.dataset.for, opt.dataset.value);
    return;
  }
  if(cselOpenId && !e.target.closest('#cselPortal')) closeCsel();
});
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && cselOpenId) closeCsel(); });
window.addEventListener('scroll', (e)=>{
  if(!cselOpenId) return;
  const portal = document.getElementById('cselPortal');
  if(portal && (e.target===portal || (portal.contains && e.target.nodeType && portal.contains(e.target)))) return;

function toast(msg){

function previewCols(kind){
  if(kind==='claims'){
    return [
      {key:'name', label:t('previewColName')},
      {key:'category', label:t('previewColCategory')},
      {key:'month', label:t('previewColMonth')},
      {key:'year', label:t('previewColYear')},
      {key:'before', label:t('previewColBefore'), numeric:true},
      {key:'after', label:t('previewColAfter'), numeric:true},
    ];
  }
  return [
    {key:'name', label:t('previewColName')},
    {key:'orders', label:t('previewColOrders'), numeric:true},
    {key:'dues', label:t('previewColDues'), numeric:true},
    {key:'firstDue', label:t('previewColFirstDue')},
    {key:'lastDue', label:t('previewColLastDue')},
    {key:'refAvgBefore', label:t('previewColRefBefore'), numeric:true},
    {key:'refAvgAfter', label:t('previewColRefAfter'), numeric:true},
  ];
}
function buildPreviewRows(grid, kind){
  const headerRow = grid[0];
  const colMap = kind==='claims' ? headerRow.map(matchHeaderClaims) : headerRow.map(matchHeaderAccounts);
  const rows = [];
  let checksum = null;
  for(let i=1;i<grid.length;i++){
    const row = grid[i];
    if(!row || row.every(v=>v===""||v==null)) continue;
    let rec;
    if(kind==='claims'){
      rec = {rowNum:i+1, kind:'claims', name:'', category:'', budgetType:'', month:'', year:'', before:0, after:0, reasons:[], notes:[], isTotal:false};
      let badBefore=false, badAfter=false;
      colMap.forEach((key, idx)=>{
        if(!key) return;
        const val = row[idx];
        if(key==='before'){ const p = parseNum(val); rec.before = p.value; if(!p.ok) badBefore = true; }
        else if(key==='after'){ const p = parseNum(val); rec.after = p.value; if(!p.ok) badAfter = true; }
        else rec[key] = String(val??'').trim();
      });
      if(isTotalRow(rec.name)){
        rec.isTotal = true; rec.included = false; rec.valid = true; rec.notes.push(t('totalRowNote'));
        checksum = { before: rec.before, after: rec.after };
      } else {
        if(!rec.name) rec.reasons.push(t('reasonName'));
        if(badBefore) rec.reasons.push(t('reasonBefore'));
        if(badAfter) rec.reasons.push(t('reasonAfter'));
        rec.valid = rec.reasons.length===0;
        rec.included = rec.valid;
      }
    } else {
      rec = {rowNum:i+1, kind:'accounts', name:'', orders:0, dues:0, firstDue:null, lastDue:null, refAvgBefore:0, refAvgAfter:0, reasons:[], notes:[], isTotal:false};
      let badOrders=false, badDues=false;
      colMap.forEach((key, idx)=>{
        if(!key) return;
        const val = row[idx];
        if(key==='name') rec.name = String(val??'').trim();
        else if(key==='orders'){ const p=parseNum(val); rec.orders=p.value; if(!p.ok) badOrders=true; }
        else if(key==='dues'){ const p=parseNum(val); rec.dues=p.value; if(!p.ok) badDues=true; }
        else if(key==='refAvgBefore'){ rec.refAvgBefore = parseNum(val).value; }
        else if(key==='refAvgAfter'){ rec.refAvgAfter = parseNum(val).value; }
        else if(key==='firstDue'){ rec.firstDue = parseDate(val); }
        else if(key==='lastDue'){ rec.lastDue = parseDate(val); }
      });
      if(isTotalRow(rec.name)){
        rec.isTotal = true; rec.included = false; rec.valid = true; rec.notes.push(t('totalRowNote'));
        checksum = { orders:rec.orders, dues:rec.dues, refAvgBefore:rec.refAvgBefore, refAvgAfter:rec.refAvgAfter };
      } else {
        if(!rec.name) rec.reasons.push(t('reasonName'));
        if(badOrders) rec.reasons.push(t('reasonOrders'));
        if(badDues) rec.reasons.push(t('reasonDues'));
        if(rec.firstDue && rec.lastDue && rec.firstDue > rec.lastDue){
          const tmp = rec.firstDue; rec.firstDue = rec.lastDue; rec.lastDue = tmp;
          rec.notes.push(t('dateFixedNote'));
        }
        rec.valid = rec.reasons.length===0;
        rec.included = rec.valid;
      }
    }
    rows.push(rec);
  }
  return {rows, checksum};
}

const slotsLoading = new Set();
function slotCap(kind){ return kind==='claims' ? 'Claims' : 'Accounts'; }
function showSlotLoading(kind, pct){
  slotsLoading.add(kind);
  const cap = slotCap(kind);
  const emptyEl = document.getElementById('slot'+cap+'Empty');
  const filledEl = document.getElementById('slot'+cap+'Filled');
  const loadingEl = document.getElementById('slot'+cap+'Loading');
  if(emptyEl) emptyEl.hidden = true;
  if(filledEl) filledEl.hidden = true;
  loadingEl.hidden = false;

    bar.classList.add('indeterminate');
    bar.style.width = '';
    text.textContent = t('slotParsing');
  } else {
    bar.classList.remove('indeterminate');
    bar.style.width = Math.min(100,Math.max(0,pct))+'%';
    text.textContent = t('slotReading', {pct: Math.round(pct)});
  }
}
function hideSlotLoading(kind){
  slotsLoading.delete(kind);
  const cap = slotCap(kind);
  const loadingEl = document.getElementById('slot'+cap+'Loading');
  if(loadingEl) loadingEl.hidden = true;
}
function failImport(kind, message){
  hideSlotLoading(kind);
  refreshSlotUI();
  document.getElementById('sheetZone').hidden = true;
  document.getElementById('previewZone').hidden = true;
  document.getElementById('importZone').hidden = false;
  const status = document.getElementById('importStatus');
  status.className = 'err';
  status.textContent = message;
}

function parseAndLoad(file, kindHint){
  const status = document.getElementById('importStatus');
  status.className = ''; status.textContent = '';
  showSlotLoading(kindHint, 0);
  const isCsv = /\.csv$/i.test(file.name);
  const reader = new FileReader();
  reader.onprogress = (e)=>{
    if(e.lengthComputable){
      showSlotLoading(kindHint, Math.min(95, (e.loaded/e.total)*85));
    }
  };
  reader.onload = (e)=>{
    showSlotLoading(kindHint, null);
    requestAnimationFrame(()=> setTimeout(()=>{
      try{
        const wb = isCsv ? XLSX.read(e.target.result, {type:'string', cellDates:true}) : XLSX.read(e.target.result, {type:'array', cellDates:true});
        if(!wb.SheetNames.length){ failImport(kindHint, t('errEmptyFile')); return; }
        if(!state.currency) state.currency = document.getElementById('currencyInput').value.trim();
        state.workbook = wb;
        state.pending = { kindHint, fileName:file.name };
        if(wb.SheetNames.length > 1){
          showSheetPicker(wb);
        }else{
          loadSheet(wb, wb.SheetNames[0]);
        }
      }catch(err){
        failImport(kindHint, t('errRead'));
      }
    }, 0));
  };
  reader.onerror = ()=>{ failImport(kindHint, t('errRead')); };
  if(isCsv) reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
}

function showSheetPicker(wb){
  hideSlotLoading(state.pending.kindHint);
  document.getElementById('importZone').hidden = true;
  document.getElementById('sheetZone').hidden = false;
  document.getElementById('sheetTitle').textContent = t('sheetTitle');
  document.getElementById('sheetHint').textContent = t('sheetHint');
  document.getElementById('cancelSheetBtn').textContent = t('cancelSheet');
  document.getElementById('confirmSheetBtn').textContent = t('confirmSheet');
  state.sheetName = wb.SheetNames[0];
  renderSheetList(wb);
}
function renderSheetList(wb){
  const list = document.getElementById('sheetList');
  list.innerHTML = wb.SheetNames.map(name=>{
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:"", raw:false});
    const rowCount = Math.max(0, grid.filter(r=>r && !r.every(v=>v==="" || v==null)).length - 1);
    const active = name === state.sheetName;
    return '<div class="sheet-opt'+(active?' active':'')+'" data-sheet="'+esc(name)+'">'
      +'<div class="sheet-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9 13h6M9 17h6"/></svg></div>'
      +'<div class="sheet-body"><div class="sheet-name">'+esc(name)+'</div><div class="sheet-meta">'+t('sheetRows',{n:rowCount})+'</div></div>'
      +'<div class="sheet-radio"></div></div>';

function cancelSheetPicker(){
  hideSlotLoading((state.pending||{}).kindHint || 'claims');
  state.workbook = null; state.sheetName = null; state.pending = null;
  document.getElementById('sheetZone').hidden = true;
  document.getElementById('importZone').hidden = false;
  document.getElementById('fileInputClaims').value = '';
  document.getElementById('fileInputAccounts').value = '';
}
function loadSheet(wb, sheetName){
  const kindHint = state.pending.kindHint;
  try{
    const sheet = wb.Sheets[sheetName];
    const grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
    if(!grid.length){ failImport(kindHint, t('errEmptyFile')); return; }
    const headerRow = grid[0];
    const detected = detectKind(headerRow);
    const kind = detected || kindHint;
    if(!detected){ failImport(kindHint, t('errNoColumns')); return; }
    const {rows, checksum} = buildPreviewRows(grid, kind);
    if(!rows.length){ failImport(kindHint, t('errEmptyFile')); return; }
    state.pending.kind = kind;
    state.pending.grid = grid;
    state.pending.headerRow = headerRow;
    state.pending.sheetName = sheetName;
    state.pending.rows = rows;
    state.pending.checksum = checksum;
    document.getElementById('sheetZone').hidden = true;
    showPreview();
  }catch(err){
    failImport(kindHint, t('errRead'));
  }
}

function showPreview(){
  hideSlotLoading(state.pending.kindHint);
  document.getElementById('importZone').hidden = true;
  document.getElementById('previewZone').hidden = false;
  renderPreview();
}
function switchPreviewKind(kind){
  if(state.pending.kind === kind) return;
  const {rows, checksum} = buildPreviewRows(state.pending.grid, kind);
  state.pending.kind = kind;
  state.pending.rows = rows;
  state.pending.checksum = checksum;
  renderPreview();
}
function renderPreview(){
  const kind = state.pending.kind;
  const rows = state.pending.rows || [];
  const cols = previewCols(kind);
  const validCount = rows.filter(r=>r.valid && !r.isTotal).length;
  const invalidCount = rows.filter(r=>!r.valid && !r.isTotal).length;
  const selectedCount = rows.filter(r=>r.included).length;
  document.getElementById('previewKindClaimsBtn').textContent = t('kindClaims');
  document.getElementById('previewKindAccountsBtn').textContent = t('kindAccounts');
  document.getElementById('previewKindClaimsBtn').classList.toggle('active', kind==='claims');
  document.getElementById('previewKindAccountsBtn').classList.toggle('active', kind==='accounts');
  document.getElementById('previewSummary').innerHTML = t('previewSummary', {total:rows.length, selected:selectedCount, valid:validCount, invalid:invalidCount});
  document.getElementById('selectAllRowsBtn').textContent = t('selectAllRows');
  document.getElementById('selectValidRowsBtn').textContent = t('selectValidRows');
  document.getElementById('selectNoneRowsBtn').textContent = t('selectNoneRows');
  document.getElementById('previewHeadRow').innerHTML =
    '<th class="colcheck"><input type="checkbox" id="previewHeadCheck" class="row-check"></th>'+
    '<th>'+t('previewColStatus')+'</th><th>'+t('previewColRow')+'</th>'+
    cols.map(c=>'<th>'+esc(c.label)+'</th>').join('')+
    '<th>'+t('previewColNotes')+'</th>';
  document.getElementById('previewBody').innerHTML = rows.map((r,idx)=>{
    const dot = r.isTotal
      ? '<span class="status-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></span>'
      : (r.valid
        ? '<span class="status-dot ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>'
        : '<span class="status-dot bad"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg></span>');
    const cls = [r.valid?'':'invalid', r.included?'':'excluded'].filter(Boolean).join(' ');
    const cells = cols.map(c=>{
      let v = r[c.key];
      if(c.numeric) v = fmt(v);
      else v = esc(v||'—');
      return '<td>'+v+'</td>';
    }).join('');
    const noteText = [...r.reasons, ...r.notes].join(' · ') || '—';
    return '<tr class="'+cls+'">'
      +'<td class="colcheck"><input type="checkbox" class="row-check" data-row-idx="'+idx+'"'+(r.included?' checked':'')+(r.isTotal?' disabled':'')+'></td>'
      +dot+'<td>'+r.rowNum+'</td>'+cells
      +'<td class="notes">'+noteText+'</td></tr>';
  }).join('');
  const headCheck = document.getElementById('previewHeadCheck');
  const selectable = rows.filter(r=>!r.isTotal);
  headCheck.checked = selectable.length>0 && selectable.every(r=>r.included);
  headCheck.indeterminate = selectable.some(r=>r.included) && !selectable.every(r=>r.included);
  headCheck.addEventListener('change', ()=>{
    rows.forEach(r=>{ if(!r.isTotal) r.included = headCheck.checked; });
    renderPreview();
  });
  document.getElementById('previewBody').querySelectorAll('[data-row-idx]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      rows[Number(cb.dataset.rowIdx)].included = cb.checked;
      renderPreview();
    });
  });
  const confirmBtn = document.getElementById('confirmImportBtn');
  confirmBtn.textContent = selectedCount ? t('confirmImport', {n:selectedCount}) : t('noValidRows');
  confirmBtn.disabled = selectedCount === 0;
  document.getElementById('cancelPreviewBtn').textContent = t('cancelPreview');
  document.getElementById('previewTitle').textContent = t('previewTitle');
}
function confirmImport(){
  const kind = state.pending.kind;
  const selected = (state.pending.rows||[]).filter(r=>r.included && !r.isTotal);
  if(kind==='claims'){
    state.claims = selected.map(r=>{
      const mIdx = mIdxFor(r.year, r.month);
      return {id:uid(), key:entityKey(r.name), name:r.name, category:r.category, budgetType:r.budgetType,
        month:r.month, year:r.year, mIdx, before:r.before, after:r.after, discount:r.before-r.after};
    });
    state.checksums.claims = state.pending.checksum;
  } else {
    const cutoff = extractRefCutoff(state.pending.headerRow);
    if(cutoff) state.refCutoff = cutoff;
    state.accounts = selected.map(r=>({id:uid(), key:entityKey(r.name), name:r.name, orders:r.orders, dues:r.dues,
      firstDue:r.firstDue, lastDue:r.lastDue, refAvgBefore:r.refAvgBefore, refAvgAfter:r.refAvgAfter}));
    state.checksums.accounts = state.pending.checksum;
  }
  state.imports[kind] = {fileName: state.pending.fileName, sheetName: state.pending.sheetName, rows: selected.length, at: Date.now()};
  pruneEntityMap();
  state.period.from = null; state.period.to = null; state.period.cutoff = null; state.period.preset='all';
  rebuildIndex();
  state.pending = null;
  state.workbook = null; state.sheetName = null;
  document.getElementById('previewZone').hidden = true;
  document.getElementById('fileInputClaims').value = '';
  document.getElementById('fileInputAccounts').value = '';
  refreshSlotUI();
  document.getElementById('proceedReportBtn').hidden = false;
  document.getElementById('proceedReportBtn').textContent = t('proceedToReport');
  if(!document.getElementById('reportArea').hidden){
    showReport();
  } else {
    document.getElementById('importZone').hidden = false;
  }
}
function cancelPreview(){
  state.pending = null;
  state.workbook = null; state.sheetName = null;
  document.getElementById('previewZone').hidden = true;
  document.getElementById('importZone').hidden = false;
  document.getElementById('fileInputClaims').value = '';
  document.getElementById('fileInputAccounts').value = '';
  document.getElementById('importStatus').textContent = '';
  document.getElementById('importStatus').className = '';
}
function pruneEntityMap(){
  const claimsKeys = new Set(state.claims.map(r=>r.key));
  const accountsKeys = new Set(state.accounts.map(r=>r.key));
  Object.keys(state.entityMap).forEach(ak=>{
    if(!accountsKeys.has(ak) || !claimsKeys.has(state.entityMap[ak])) delete state.entityMap[ak];
  });
}
function removeSlot(kind){
  if(kind==='claims'){ state.claims = []; state.checksums.claims = null; }
  else { state.accounts = []; state.checksums.accounts = null; }
  state.imports[kind] = null;
  pruneEntityMap();
  rebuildIndex();
  refreshSlotUI();
  const anyData = state.claims.length || state.accounts.length;
  document.getElementById('proceedReportBtn').hidden = !anyData;
  if(!anyData){
    document.getElementById('reportArea').hidden = true;
    document.getElementById('reimportBtn').hidden = true;
    document.getElementById('printBtn').hidden = true;
  } else if(!document.getElementById('reportArea').hidden){
    showReport();
  }
}
function auditLineHtml(kind){
  const cs = state.checksums[kind];
  if(!cs) return '';
  let diffs = [];
  if(kind==='claims'){
    const sumBefore = state.claims.reduce((s,r)=>s+r.before,0);
    const sumAfter = state.claims.reduce((s,r)=>s+r.after,0);
    if(Math.round(sumBefore) !== Math.round(cs.before||0)) diffs.push(fmtSigned(sumBefore-(cs.before||0))+' '+t('colBefore'));
    if(Math.round(sumAfter) !== Math.round(cs.after||0)) diffs.push(fmtSigned(sumAfter-(cs.after||0))+' '+t('colAfter'));
  } else {
    const sumOrders = state.accounts.reduce((s,r)=>s+r.orders,0);
    const sumDues = state.accounts.reduce((s,r)=>s+r.dues,0);
    if(Math.round(sumOrders) !== Math.round(cs.orders||0)) diffs.push(fmtSigned(sumOrders-(cs.orders||0))+' '+t('kpiOrders'));
    if(Math.round(sumDues) !== Math.round(cs.dues||0)) diffs.push(fmtSigned(sumDues-(cs.dues||0))+' '+t('kpiDues'));
  }
  if(!diffs.length) return '<div class="audit-line ok"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>'+esc(t('auditOk'))+'</div>';

}

function rebuildIndex(){
  const monthsSet = new Set();
  state.claims.forEach(r=>{ if(r.mIdx!=null) monthsSet.add(r.mIdx); });
  const monthsPresent = [...monthsSet].sort((a,b)=>a-b);
  const byEntityMonth = new Map();
  state.claims.forEach(r=>{
    if(r.mIdx==null) return;
    const k = r.key+'|'+r.mIdx;
    if(!byEntityMonth.has(k)) byEntityMonth.set(k, {before:0, after:0, count:0});
    const e = byEntityMonth.get(k);
    e.before += r.before; e.after += r.after; e.count += 1;
  });
  const minIdx = monthsPresent.length ? monthsPresent[0] : null;
  const maxIdx = monthsPresent.length ? monthsPresent[monthsPresent.length-1] : null;

  const claimsKeys = new Set(state.claims.map(r=>r.key));
  const accountsKeys = new Set(state.accounts.map(r=>r.key));
  const matchedAccountKeys = new Set();
  const matchedClaimKeys = new Set();
  accountsKeys.forEach(ak=>{
    const target = state.entityMap[ak] || ak;
    if(claimsKeys.has(target)){ matchedAccountKeys.add(ak); matchedClaimKeys.add(target); }
  });
  const accountsOnly = new Set([...accountsKeys].filter(k=>!matchedAccountKeys.has(k)));
  const claimsOnly = new Set([...claimsKeys].filter(k=>!matchedClaimKeys.has(k)));

  state.index = { monthsPresent, byEntityMonth, minIdx, maxIdx, matchedAccountKeys, matchedClaimKeys, accountsOnly, claimsOnly };

  if(state.period.from==null || state.period.to==null){
    state.period.from = minIdx; state.period.to = maxIdx;
  } else {
    clampPeriod();
  }
  if(state.period.cutoff==null){
    if(state.refCutoff.y!=null) state.period.cutoff = state.refCutoff.y*12 + (state.refCutoff.m-1);
    else if(minIdx!=null && maxIdx!=null) state.period.cutoff = Math.round((minIdx+maxIdx)/2);
  }
  if(state.claims.length && state.accounts.length && !state._everBothLoaded){
    state.view = 'entity';
    state._everBothLoaded = true;
  }
}
function clampPeriod(){
  const {minIdx, maxIdx} = state.index;
  if(minIdx==null || maxIdx==null) return;
  if(state.period.from==null) state.period.from = minIdx;
  if(state.period.to==null) state.period.to = maxIdx;
  state.period.from = Math.min(Math.max(state.period.from, minIdx), maxIdx);
  state.period.to = Math.min(Math.max(state.period.to, minIdx), maxIdx);
  if(state.period.from > state.period.to){ const tmp = state.period.from; state.period.from = state.period.to; state.period.to = tmp; }
}
function accountSummaryByKey(key){
  const rows = state.accounts.filter(a=>a.key===key);
  if(!rows.length) return null;
  const firstDates = rows.map(a=>a.firstDue).filter(Boolean).sort();
  const lastDates = rows.map(a=>a.lastDue).filter(Boolean).sort();
  const average = field => {
    const values = rows.map(a=>Number(a[field])).filter(Number.isFinite);
    return values.length ? values.reduce((sum,value)=>sum+value,0)/values.length : 0;
  };
  return {
    key,
    name: rows[0].name,
    orders: rows.reduce((sum,a)=>sum+(a.orders||0),0),
    dues: rows.reduce((sum,a)=>sum+(a.dues||0),0),
    firstDue: firstDates[0] || null,
    lastDue: lastDates[lastDates.length-1] || null,
    refAvgBefore: average('refAvgBefore'),
    refAvgAfter: average('refAvgAfter'),
  };
}
function accountsByKey(key){ return accountSummaryByKey(key); }
function claimsNameFor(key){ const r = state.claims.find(c=>c.key===key); return r ? r.name : key; }

function tokenOverlapRatio(a,b){
  const ta = new Set(entityKey(a).split(' ').filter(Boolean));
  const tb = new Set(entityKey(b).split(' ').filter(Boolean));
  if(!ta.size || !tb.size) return 0;
  let inter=0; ta.forEach(x=>{ if(tb.has(x)) inter++; });
  const union = new Set([...ta,...tb]).size;
  return union ? inter/union : 0;
}
function suggestMatch(accountName, claimsOnlyNames){
  let best=null, bestScore=0;
  claimsOnlyNames.forEach(n=>{
    const s = tokenOverlapRatio(accountName, n);
    if(s>bestScore){ bestScore=s; best=n; }
  });
  return bestScore>=0.8 ? best : null;
}

function scopedClaims(){
  const q = normalizeText(state.query);
  const {from, to} = state.period;
  return state.claims.filter(r=>{
    if(from!=null && r.mIdx!=null && r.mIdx<from) return false;
    if(to!=null && r.mIdx!=null && r.mIdx>to) return false;
    if(state.filters.category!=='all' && r.category!==state.filters.category) return false;
    if(state.filters.budget!=='all' && r.budgetType!==state.filters.budget) return false;
    if(state.filters.month!=='all' && r.month!==state.filters.month) return false;
    if(state.filters.year!=='all' && String(r.year)!==String(state.filters.year)) return false;
    if(state.filters.matchedOnly && !state.index.matchedClaimKeys.has(r.key)) return false;
    if(q && !(normalizeText(r.name).includes(q) || normalizeText(r.category).includes(q))) return false;
    return true;
  });
}
function computeFiltered(){
  const base = scopedClaims().filter(r=> state.filters.entity==='all' || r.name===state.filters.entity);
  return applySort(base);
}
function currentAccountsKeySet(){
  let list = state.accounts;
  if(state.filters.entity!=='all'){
    const targetKey = entityKey(state.filters.entity);
    list = list.filter(a=>a.key===targetKey);
  }
  if(state.filters.matchedOnly) list = list.filter(a=>state.index.matchedAccountKeys.has(a.key));
  return new Set(list.map(a=>a.key));
}
function sumAccounts(keySet){
  let orders=0, dues=0;
  state.accounts.forEach(a=>{ if(keySet.has(a.key)){ orders += a.orders||0; dues += a.dues||0; } });
  return {orders, dues};
}
function sumAfterIn(rows, fromIdx, toIdx){
  return rows.filter(r=> fromIdx==null || toIdx==null || (r.mIdx!=null && r.mIdx>=fromIdx && r.mIdx<=toIdx)).reduce((s,r)=>s+r.after,0);
}
function periodDivisor(rows, fromIdx, toIdx){
  if(fromIdx==null || toIdx==null || toIdx<fromIdx) return 0;
  if(state.period.basis==='calendar') return (toIdx-fromIdx+1);
  const distinct = new Set(rows.filter(r=>r.mIdx!=null && r.mIdx>=fromIdx && r.mIdx<=toIdx).map(r=>r.mIdx));
  return distinct.size;
}
function avgMonthlyFor(rows, fromIdx, toIdx){
  const divisor = periodDivisor(rows, fromIdx, toIdx);
  if(!divisor) return null;
  return sumAfterIn(rows, fromIdx, toIdx) / divisor;
}

function currencyUnit(){ return state.currency ? ' '+state.currency : ''; }
function kpiCard(cls, src, label, value, sub){
  const dot = src ? '<span class="kpi-src-dot '+src+'"></span>' : '';
  return '<div class="card kpi'+(cls?' '+cls:'')+'"><span class="kpi-label">'+dot+label+'</span><span class="kpi-value">'+value+'</span>'+(sub?'<span class="kpi-sub">'+sub+'</span>':'')+'</div>';
}

    +'<button type="button" class="avg-src-btn'+(state.avgSource==='claims'?' active':'')+'" data-avgsrc="claims">'+t('slotClaimsLabel')+'</button>'

function renderKpis(){
  const host = document.getElementById('kpiStrip');
  if(!state.claims.length && !state.accounts.length){ host.innerHTML=''; return; }
  const tiles = [];

  if(state.claims.length){
    const records = computeFiltered();
    const entities = new Set(records.map(r=>r.key)).size;
    tiles.push(kpiCard('', 'claims', t('kpiRecords'), fmt(records.length), entities+' '+t('kpiEntitiesSuffix')));
    const totalBefore = records.reduce((s,r)=>s+r.before,0);
    tiles.push(kpiCard('', 'claims', t('kpiBefore'), fmt(totalBefore)+currencyUnit(), periodLabelForToolbar()));
    const totalAfter = records.reduce((s,r)=>s+r.after,0);
    tiles.push(kpiCard('accent', 'claims', t('colTotalAfterPeriod'), fmt(totalAfter)+currencyUnit(), periodLabelForToolbar()));

    let avgValue, avgSub, avgSrc;
    if(state.avgSource==='accounts' && state.accounts.length){
      const keySet = currentAccountsKeySet();
      const list = state.accounts.filter(a=>keySet.has(a.key));
      avgValue = list.length ? list.reduce((s,a)=>s+a.refAvgAfter,0) : null;
      avgSub = avgSourceToggleHtml()+'<span class="kpi-sub-note">'+esc(t('avgAccountsNote'))+'</span>';
      avgSrc = 'accounts';
    } else {
      avgValue = avgMonthlyFor(records, state.period.from, state.period.to);
      avgSub = avgSourceToggleHtml()+'<span class="kpi-sub-note">'+esc(periodLabelForToolbar())+'</span>';
      avgSrc = 'claims';
    }
    tiles.push(kpiCard('', avgSrc, t('kpiAvgMonthly'), avgValue==null?'—':fmt(avgValue)+currencyUnit(), avgSub));

    if(state.period.split && state.period.cutoff!=null){
      const avgA = avgMonthlyFor(records, state.period.from, state.period.cutoff-1);
      const avgB = avgMonthlyFor(records, state.period.cutoff, state.period.to);
      const delta = (avgA!=null && avgA!==0 && avgB!=null) ? ((avgB-avgA)/avgA)*100 : null;
      const deltaHtml = delta==null ? '—' : '<span class="delta-pill '+(delta<=0?'good':'bad')+'">'+(delta>0?'+':'')+delta.toFixed(1)+'%</span>';
      const valueHtml = (avgA==null?'—':fmt(avgA)) + ' → ' + (avgB==null?'—':fmt(avgB));
      tiles.push(kpiCard('', 'claims', t('kpiSplitDelta'), valueHtml, deltaHtml));
    }
  }
  if(state.accounts.length){
    const keySet = currentAccountsKeySet();
    const acc = sumAccounts(keySet);
    tiles.push(kpiCard('', 'accounts', t('kpiOrders'), fmt(acc.orders), t('allPeriods')));
    const cs = state.checksums.accounts;
    let duesSub = t('allPeriods');
    if(cs){
      const sumDues = state.accounts.reduce((s,r)=>s+r.dues,0);
      duesSub = Math.round(sumDues)===Math.round(cs.dues||0) ? t('auditOk') : t('auditWarn',{n:fmtSigned(sumDues-(cs.dues||0))});
    }
    tiles.push(kpiCard('accent', 'accounts', t('kpiDues'), fmt(acc.dues)+currencyUnit(), duesSub));
  }
  host.innerHTML = tiles.join('');
}

function groupKeyValue(r, dim){
  if(dim==='category') return r.category || '—';
  if(dim==='budgetType') return r.budgetType || '—';
  if(dim==='name') return r.name || '—';
  if(dim==='month') return r.month || '—';
  if(dim==='year') return String(r.year || '—');
  return null;
}
function buildGroups(records, dims){
  const active = GROUP_DIM_ORDER.filter(d=>dims.has(d));
  if(!active.length) return [{ key:'__all__', label:'', rows: records }];
  const map = {};
  records.forEach(r=>{
    const parts = active.map(d=>groupKeyValue(r,d));
    const key = parts.join('␟');
    if(!map[key]) map[key] = { parts, rows: [] };
    map[key].rows.push(r);
  });
  return Object.keys(map).sort((ka,kb)=>{
    const ea = map[ka], eb = map[kb];
    const bySort = compareGroupsBySort(ea, eb, active);
    if(bySort!==0) return bySort;
    for(let i=0;i<active.length;i++){
      const c = groupKeyCompare(ea.parts[i], eb.parts[i], active[i]);
      if(c!==0) return c;
    }
    return 0;
  }).map(k=>{
    const entry = map[k];
    const label = active.length>1
      ? entry.parts.map((v,i)=>groupDimLabel(active[i])+': '+v).join(' · ')
      : entry.parts[0];
    return { key:k, label, rows: entry.rows, isEntityGroup: active.length===1 && active[0]==='name' };
  });
}
function computeAggregates(records, dims){
  const groups = buildGroups(records, dims);
  return groups.map(g=>({
    label: g.label || t('groupAllLabel'),
    rows: g.rows,
    sumBefore: g.rows.reduce((s,r)=>s+r.before,0),
    sumAfter: g.rows.reduce((s,r)=>s+r.after,0),
    entityCount: new Set(g.rows.map(r=>r.key)).size,
    isEntityGroup: g.isEntityGroup,
  }));
}

let entityRowsCache = [];
function groupClaimsByKey(rows){
  const map = new Map();
  rows.forEach(r=>{
    if(!map.has(r.key)) map.set(r.key, {name:r.name, rows:[]});
    map.get(r.key).rows.push(r);
  });
  return map;
}
function buildEntityRow(account, key, claimsInfo){
  const name = claimsInfo ? claimsInfo.name : (account ? account.name : key);
  const claimRows = claimsInfo ? claimsInfo.rows : [];
  const hasClaims = claimRows.length > 0;
  const hasAccount = !!account;
  const claimsCount = claimRows.length;
  const totalBefore = hasClaims ? claimRows.reduce((s,r)=>s+r.before,0) : null;
  const totalAfter = hasClaims ? claimRows.reduce((s,r)=>s+r.after,0) : null;
  const discount = hasClaims ? totalBefore-totalAfter : null;
  const avgMonthly = hasClaims ? avgMonthlyFor(claimRows, state.period.from, state.period.to) : null;
  const refBefore = hasAccount ? account.refAvgBefore : null;
  const refAfter = hasAccount ? account.refAvgAfter : null;
  let delta = null;
  if(hasAccount && refBefore){ delta = ((refAfter-refBefore)/refBefore)*100; }
  const dues = hasAccount ? account.dues : null;
  let reconcileGap = null, reconcilePct = null;
  if(hasAccount && hasClaims){
    reconcileGap = totalAfter - dues;
    reconcilePct = dues ? (reconcileGap/dues)*100 : null;
  }
  let marker = null;
  if(hasAccount && !hasClaims) marker = 'onlyAccounts';
  else if(!hasAccount && hasClaims) marker = 'onlyClaims';
  return {
    key, name,
    claimsCount, orders: hasAccount?account.orders:null, dues,
    firstDue: hasAccount?account.firstDue:null, lastDue: hasAccount?account.lastDue:null,
    totalBefore, totalAfter, discount, avgMonthly, refAvgBefore: refBefore, refAvgAfter: refAfter, delta,
    reconcileGap, reconcilePct,
    marker,
  };
}
function buildEntityRows(){
  const claimRows = scopedClaims();
  const claimsGrouped = groupClaimsByKey(claimRows);
  const usedClaimKeys = new Set();
  const rows = [];
  const accountKeys = [...new Set(state.accounts.map(a=>a.key))];
  accountKeys.forEach(accountKey=>{
    const account = accountSummaryByKey(accountKey);
    const linkedKey = state.entityMap[accountKey] || (claimsGrouped.has(accountKey) ? accountKey : null);
    const info = linkedKey ? claimsGrouped.get(linkedKey) : null;
    if(linkedKey) usedClaimKeys.add(linkedKey);
    rows.push(buildEntityRow(account, accountKey, info));
  });
  claimsGrouped.forEach((info,key)=>{
    if(usedClaimKeys.has(key)) return;
    rows.push(buildEntityRow(null, key, info));
  });
  let filtered = rows;
  if(state.entityFocus === 'claims') filtered = filtered.filter(r=>r.claimsCount>0);
  else if(state.entityFocus === 'accounts') filtered = filtered.filter(r=>r.dues!=null || r.orders!=null);
  if(state.filters.entity!=='all') filtered = filtered.filter(r=>r.name===state.filters.entity);
  if(state.filters.matchedOnly) filtered = filtered.filter(r=>!r.marker);
  const q = normalizeText(state.query);
  if(q) filtered = filtered.filter(r=>normalizeText(r.name).includes(q));
  return filtered;
}
