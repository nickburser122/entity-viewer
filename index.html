    +focusSeg+'</div>';
  if(!rows.length){ host.innerHTML = controlBar+'<div class="entity-empty-note">'+t('noResults')+'</div>'; return; }
  host.innerHTML = controlBar+'<div class="card-grid">'+rows.map(renderEntityCard).join('')+'</div>';
  const seg = document.getElementById('entityFocusSeg');
  if(seg) seg.querySelectorAll('[data-focus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.entityFocus = btn.dataset.focus; renderAll(); });
  });
}

function renderAll(){
  renderMatchPanel();
  renderKpis();
  renderPeriodToolbar();
  if(state.view === 'table') renderTableView();
  else if(state.view === 'entity') renderEntityView();
  else renderCardsView();
}

function showReport(){
  document.getElementById('reportArea').hidden = false;
  document.getElementById('reimportBtn').hidden = false;
  document.getElementById('printBtn').hidden = false;
  document.getElementById('importZone').hidden = true;
  document.querySelectorAll('#viewSeg .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  document.getElementById('tableModeSeg').hidden = state.view !== 'table';
  document.querySelector('.toolbar.second').hidden = state.view === 'entity';
  renderGroupDimChips();
  populateFilterOptions();
  renderSortControls();
  renderAll();
}
function currentRecordCount(){ return state.claims.length + state.accounts.length; }

function renderChrome(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';
  document.title = t('appTitle');
  document.getElementById('mastTitle').textContent = t('appTitle');
  document.getElementById('mastSub').textContent = t('appSub');
  document.getElementById('printRunTitle').textContent = t('appTitle');
  document.getElementById('langBtn').textContent = t('langSwitch');
  document.getElementById('reimportBtn').textContent = t('editImport');
  document.getElementById('printBtnLabel').textContent = t('printBtn');
  document.getElementById('importTitle').textContent = t('importTitle');
  document.getElementById('importHint').textContent = t('importHint');
  document.getElementById('currencyLabel').childNodes[0].textContent = t('currencyLabel');
  document.getElementById('currencyInput').placeholder = t('currencyPh');
  document.getElementById('searchInput').placeholder = t('searchPh');
  document.querySelector('#viewSeg [data-view="table"]').textContent = t('viewTable');
  document.querySelector('#viewSeg [data-view="cards"]').textContent = t('viewCards');
  document.querySelector('#viewSeg [data-view="entity"]').textContent = t('viewEntity');
  document.querySelector('#tableModeSeg [data-mode="detailed"]').textContent = t('tableModeDetailed');
  document.querySelector('#tableModeSeg [data-mode="aggregated"]').textContent = t('tableModeAggregated');
  document.getElementById('groupByLabel').textContent = t('groupByLabel');
  document.getElementById('resetFiltersLabel').textContent = t('resetFilters');
  document.getElementById('sortByLabel').textContent = t('sortByLabel');
  document.getElementById('addSortLabel').textContent = t('sortAddLevel');
  document.getElementById('proceedReportBtn').textContent = t('proceedToReport');
  updateThemeButton();
  refreshSlotUI();
  if(state.pending && state.pending.rows) renderPreview();
  if(state.workbook && !document.getElementById('sheetZone').hidden){
    document.getElementById('sheetTitle').textContent = t('sheetTitle');
    document.getElementById('sheetHint').textContent = t('sheetHint');
    document.getElementById('cancelSheetBtn').textContent = t('cancelSheet');
    document.getElementById('confirmSheetBtn').textContent = t('confirmSheet');
    renderSheetList(state.workbook);
  }
  if(!document.getElementById('reportArea').hidden){
    document.querySelectorAll('#viewSeg .seg-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
    renderGroupDimChips();
    populateFilterOptions();
    renderSortControls();
    renderAll();
  }
  const meta = [];
  if(currentRecordCount()) meta.push(currentRecordCount());
  if(state.period.from!=null && state.period.to!=null) meta.push(periodLabelForToolbar()+(state.period.split?' · '+t('cutoffLabel')+': '+monthLabel(state.period.cutoff):''));
  meta.push(new Date().toLocaleDateString(state.lang==='ar'?'ar-EG':'en-US'));
  document.getElementById('printRunMeta').textContent = currentRecordCount() ? meta.join(' · ') : '';
}

function wireSlot(kind, cap){
  const dz = document.getElementById('dz'+cap);
  const input = document.getElementById('fileInput'+cap);
  dz.addEventListener('click', ()=> input.click());
  input.addEventListener('change', (e)=>{ if(e.target.files[0]) parseAndLoad(e.target.files[0], kind); });
  dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
  dz.addEventListener('drop', (e)=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) parseAndLoad(e.dataTransfer.files[0], kind); });
  document.getElementById('slot'+cap+'ReplaceBtn').addEventListener('click', ()=> input.click());
  document.getElementById('slot'+cap+'RemoveBtn').addEventListener('click', ()=> removeSlot(kind));
}
wireSlot('claims','Claims');
wireSlot('accounts','Accounts');

document.getElementById('previewKindClaimsBtn').addEventListener('click', ()=> switchPreviewKind('claims'));
document.getElementById('previewKindAccountsBtn').addEventListener('click', ()=> switchPreviewKind('accounts'));

document.getElementById('printBtn').addEventListener('click', ()=> window.print());
document.getElementById('reimportBtn').addEventListener('click', ()=>{
  document.getElementById('reportArea').hidden = true;
  document.getElementById('importZone').hidden = false;
  document.getElementById('proceedReportBtn').hidden = !currentRecordCount();
  document.getElementById('importStatus').textContent = '';
  document.getElementById('importStatus').className = '';
  refreshSlotUI();
});
document.getElementById('proceedReportBtn').addEventListener('click', showReport);
document.getElementById('cancelPreviewBtn').addEventListener('click', cancelPreview);
document.getElementById('confirmImportBtn').addEventListener('click', confirmImport);
document.getElementById('cancelSheetBtn').addEventListener('click', cancelSheetPicker);
document.getElementById('confirmSheetBtn').addEventListener('click', (e)=>{
  if(!(state.workbook && state.sheetName)) return;
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = t('confirmSheetLoading');
  requestAnimationFrame(()=> setTimeout(()=>{
    loadSheet(state.workbook, state.sheetName);
    btn.disabled = false;
  }, 0));
});
document.getElementById('selectAllRowsBtn').addEventListener('click', ()=>{
  (state.pending.rows||[]).forEach(r=>{ if(!r.isTotal) r.included = true; });
  renderPreview();
});
document.getElementById('selectValidRowsBtn').addEventListener('click', ()=>{
  (state.pending.rows||[]).forEach(r=>{ if(!r.isTotal) r.included = r.valid; });
  renderPreview();
});
document.getElementById('selectNoneRowsBtn').addEventListener('click', ()=>{
  (state.pending.rows||[]).forEach(r=>{ if(!r.isTotal) r.included = false; });
  renderPreview();
});
let searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', (e)=>{
  const val = e.target.value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ state.query = val; renderAll(); }, 200);
});
document.getElementById('resetFiltersBtn').addEventListener('click', ()=>{
  state.query='';
  state.filters = {entity:'all', category:'all', budget:'all', month:'all', year:'all', matchedOnly:false};
  state.sortRules=[{field:'none',dir:'asc'}];
  document.getElementById('searchInput').value='';
  populateFilterOptions();
  renderSortControls();
  renderAll();
});
document.querySelectorAll('#viewSeg .seg-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.view = btn.dataset.view;
    document.querySelectorAll('#viewSeg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('tableModeSeg').hidden = state.view !== 'table';
    document.querySelector('.toolbar.second').hidden = state.view === 'entity';
    populateFilterOptions();
    renderSortControls();
    renderAll();
  });
});
document.querySelectorAll('#tableModeSeg .seg-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.tableMode = btn.dataset.mode;
    document.querySelectorAll('#tableModeSeg .seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
    renderSortControls();
    renderAll();
  });
});
document.getElementById('viewHost').addEventListener('click', (e)=>{
  const copyBtn = e.target.closest('[data-copy-id]');
  if(copyBtn){ copyRecord(copyBtn.dataset.copyId); return; }
  const groupBtn = e.target.closest('[data-copy-group]');
  if(groupBtn){ copyGroup(Number(groupBtn.dataset.copyGroup)); return; }
  const entityBtn = e.target.closest('[data-copy-entity]');
  if(entityBtn){ copyEntity(entityBtn.dataset.copyEntity); return; }
});
document.getElementById('langBtn').addEventListener('click', ()=>{
  state.lang = state.lang==='ar' ? 'en' : 'ar';
  renderChrome();
});

const SUN_ICON = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === 'dark';
  const icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = dark ? SUN_ICON : MOON_ICON;
  const label = dark ? t('themeToLight') : t('themeToDark');
  const labelEl = document.getElementById('themeBtnLabel');
  if(labelEl) labelEl.textContent = label;
  const btn = document.getElementById('themeBtn');
  if(btn) btn.title = label;
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const dark = document.documentElement.dataset.theme === 'dark';
  if(dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = 'dark';
  updateThemeButton();
});
if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
  document.documentElement.dataset.theme = 'dark';
}

renderChrome();
</script>
</body>
</html>
